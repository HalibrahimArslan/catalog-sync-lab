# Backoffice ayarları. Dosya adı application.yml DEĞİL: kabul testlerinde iki uygulama aynı
# classpath'i paylaşıyor; iki application.yml çakışırdı. main() spring.config.name=backoffice ile bu dosyayı seçer.
spring:
  application:
    name: backoffice
  flyway:
    locations: classpath:db/backoffice/migration   # aynı sebeple: migration klasörleri de ayrı
  datasource:
    url: jdbc:postgresql://localhost:5432/backoffice
    username: rabbitlab
    password: rabbitlab
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitlab
    password: rabbitlab
    # Faz 1 M4'ün Spring karşılıkları:
    publisher-confirm-type: correlated   # broker her mesaj için ack/nack gönderir
    publisher-returns: true              # yönlendirilemeyen mesaj geri döner...
    template:
      mandatory: true                    # ...ve sessizce kaybolmaz

backoffice:
  outbox:
    scheduling-enabled: true
    notify-enabled: true  # outbox'a satır eklenince relay anında uyanır (LISTEN/NOTIFY)
    poll-interval: 5s     # yedek: bildirim kaçarsa en geç bu kadar gecikir
    batch-size: 100
    confirm-timeout: 5s
    cleanup-enabled: true
    cleanup-interval: 1h
    retention: 7d       # yayınlanmış satır bu süreden sonra silinir
    schema-version: 1   # yayınlanan sözleşme sürümü; 2'ye ancak Storefront iki sürümü okuyunca geçilir (P4-M3)

server:
  port: 8081
