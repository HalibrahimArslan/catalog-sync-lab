# Her push ve PR'da tüm testler: birim, entegrasyon (Testcontainers ile gerçek PostgreSQL ve RabbitMQ)
# ve Cucumber kabul senaryoları. GitHub'ın Ubuntu sunucularında Docker hazır; ek ayar gerekmez.
name: build

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Kabul testi raporu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: acceptance/target/cucumber-report.html
          if-no-files-found: ignore

  # Senaryo Konsolu (ui/): tip kontrolü, lint, senaryo motoru ve tanımlarının testleri, üretim derlemesi.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
